name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Install dependencies
        run: docker compose exec -T php composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse -c phpstan.dist.neon

      - name: Prepare test database
        run: |
          docker compose exec -T php php bin/console doctrine:database:create --env=test --if-not-exists
          docker compose exec -T php php bin/console doctrine:migrations:migrate -n --env=test

      - name: Run PHPUnit
        run: docker compose exec -T php php bin/phpunit

      - name: Stop containers
        if: always()
        run: docker compose down
